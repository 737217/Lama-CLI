[project]
name = "lama"
version = "0.1.0"
description = "Интерактивное управление локальной Ollama"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "questionary>=2.1",
    "rich>=13.9",
    "typer>=0.15",
]

[project.scripts]
lama = "lama.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/lama/i18n.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["lama"]

[tool.pytest.ini_options]
testpaths = ["tests"]
